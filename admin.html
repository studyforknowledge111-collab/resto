<!DOCTYPE html>

<html>
<head>
    <title>Admin Dashboard</title>

```
<!-- Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
```

</head>

<body class="bg-light">

<div class="container mt-5">

```
<h2 class="text-center mb-4">🍽️ Manager Dashboard</h2>

<!-- Filter Form -->
<form method="POST" class="mb-4 text-center">
    <input type="text" name="table" placeholder="Enter Table No or 'all'" class="form-control w-25 d-inline">
    <button type="submit" class="btn btn-primary">Filter</button>
    <a href="/logout" class="btn btn-secondary">Logout</a>
</form>

<!-- Orders Table -->
<table class="table table-bordered table-striped text-center">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Table</th>
            <th>Food</th>
            <th>Qty</th>
            <th>Status</th>
            <th>Payment</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for order in orders %}
        <tr>
            <td>{{ order['id'] }}</td>
            <td>{{ order['table_id'] }}</td>
            <td>{{ order['food'] }}</td>
            <td>{{ order['qty'] }}</td>
            <td>{{ order['status'] }}</td>
            <td>{{ order['payment'] }}</td>

            <td>
                <a href="/cook/{{ order['id'] }}" class="btn btn-warning btn-sm">Cook</a>
                <a href="/serve/{{ order['id'] }}" class="btn btn-success btn-sm">Serve</a>
                <a href="/pay/{{ order['id'] }}" class="btn btn-info btn-sm">Pay</a>
                <a href="/edit/{{ order['id'] }}" class="btn btn-primary btn-sm">Edit</a>

                <!-- DELETE BUTTON -->
                <a href="/delete/{{ order['id'] }}" 
                   onclick="return confirm('Are you sure you want to delete this order?')">
                    <button class="btn btn-danger btn-sm">Delete</button>
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>

</table>
```

</div>

</body>
</html>
